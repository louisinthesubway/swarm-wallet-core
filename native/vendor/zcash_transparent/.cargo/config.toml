# Applies only to builds of this vendored crate on its own, i.e. when cargo is run
# from this directory, or from `native/` with:
#
#   cargo test --locked --manifest-path vendor/zcash_transparent/Cargo.toml \
#       --config vendor/zcash_transparent/.cargo/config.toml
#
# Without it, a standalone build resolves `zcash_protocol` and `zcash_address`
# from crates.io and would silently test against the upstream constants (no
# `NetworkType::SwarmMain`) instead of the vendored SWARM ones — where it would
# not even compile, because `zip48::pub_prefix` matches `NetworkType`
# exhaustively.
#
# See vendor/zcash_primitives/.cargo/config.toml for why this is a config file
# rather than a `[workspace]` + `[patch]` pair inside Cargo.toml.
[patch.crates-io]
zcash_protocol = { path = "../zcash_protocol" }
zcash_address = { path = "../zcash_address" }
