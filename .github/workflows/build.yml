name: Build swarm-wallet-core

# The recipe is the SWARM wallet's own, from .github/workflows/swarm-wallet-windows.yml
# and swarm-wallet-unix.yml at privacy-wallet 745c2092, reduced to what this
# package is: the addon, the TypeScript, the tests. No Electron, no installers.
#
# The parts that are not optional, and why:
#   * Rust exactly 1.96.0 — the version the wallet's four green platform builds used.
#   * RUSTFLAGS '--cfg zcash_unstable="nu6.3"' — the vendored crates are Ironwood-era;
#     without it the build resolves a different cfg surface. It must be identical for
#     the vendored crates and the addon, which an environment variable guarantees.
#   * protoc on PATH — lightwallet-protocol's `rebuild-proto` feature runs it.
#   * CARGO_NET_GIT_FETCH_WITH_CLI — the SDK revision is fetched over git.
#   * The SDK checkout is read-only and only so the pin check can see which network
#     the pinned SDK targets; cargo fetches its own copy of the same revision.

# Dispatch, or a tag. Deliberately NOT every push to main: three addon builds is
# most of an hour of runner time, and a branch trigger spends it again on a commit
# that only touched a comment — and races the dispatch that was started on purpose.
# The wallet's own workflows are arranged the same way, for the same reason.
on:
  workflow_dispatch:
    inputs:
      run_live_test:
        description: 'Run the live SWARM mainnet integration test on Linux'
        type: boolean
        default: true
      release_tag:
        description: 'Release to publish the four native.node binaries (and the package tgz) to, as a PRE-release'
        type: string
        default: 'swarm-wallet-core-0.3.0'
  push:
    tags:
      # Deliberately NOT the `swarm-wallet-core-*` pattern: this workflow CREATES a
      # tag of that shape when it publishes the release below, and a workflow that
      # triggers itself is a workflow nobody can reason about.
      - "build-*"

# `write`, because the addon binaries are published to a GitHub Release rather than
# to the artifact store: on 2026-09-26 the organisation's artifact quota was
# exhausted (swarm-node's private-repo artifacts alone exceed the free tier), and
# the messenger still has to be able to fetch a native.node it can trust.
permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.96.0"
  RUSTFLAGS: '--cfg zcash_unstable="nu6.3"'
  SWARM_SDK_REV: "c7464d2ec40a5d619500a9ebee76ac4c39775baa"

jobs:
  # Everything that can refuse the build in a minute runs before the hour of
  # compilation, not after it. The wallet's workflows learned this the hard way.
  typescript:
    name: TypeScript, tests, provenance
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - name: native/ is byte-identical to the wallet it was copied from
        run: npm run check:provenance
      - name: Types
        run: npm run typecheck
      - name: Tests, with the addon mocked
        run: npm test
      - name: The package builds
        run: npm run build

  addon:
    name: addon (${{ matrix.platform }})
    needs: typescript
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 and not latest: the glibc a binary is built against is the
          # oldest it will run on, so the older image is what lets the addon load
          # in an Electron app on 22.04 and 24.04 alike.
          - platform: linux-x64
            runner: ubuntu-22.04
            script: neon
          - platform: win32-x64
            runner: windows-2025
            script: neon-win-x64
          - platform: darwin-arm64
            runner: macos-14
            script: neon-mac-arm64
          # Intel Macs, cross-compiled on the Apple-silicon runner exactly as the
          # desktop wallet's own workflow does it (the macos-13 Intel pool is
          # gone). The owner's rule: every Mac delivery covers both chips.
          - platform: darwin-x64
            runner: macos-14
            script: neon-mac-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Which release the binaries go to. A dispatch names it; a `build-<version>`
      # tag push means the release `swarm-wallet-core-<version>`; anything else
      # falls back to the first release, as it always did. Resolved once, here,
      # so the upload and the sums job cannot disagree.
      - name: Resolve the release tag
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="swarm-wallet-core-${GITHUB_REF_NAME#build-}"
          fi
          : "${tag:=swarm-wallet-core-0.1.0-m1}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "release: $tag"

      - name: Check out the pinned SDK revision
        uses: actions/checkout@v4
        with:
          repository: louisinthesubway/privacy-zingolib
          ref: c7464d2ec40a5d619500a9ebee76ac4c39775baa
          path: sdk-source

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Restore compiled Rust outputs
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: swc-${{ matrix.platform }}-rust196-nu63-${{ hashFiles('native/Cargo.lock', 'native/src/*.rs', 'sdk/swarm-sdk-pin.json') }}
          restore-keys: swc-${{ matrix.platform }}-rust196-nu63-

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version

      # darwin-x64 is built on an arm64 host, so the Intel standard library is
      # not the host's and has to be asked for. `neon-mac-x64` names
      # --target x86_64-apple-darwin; without this it fails outright.
      - name: Add the Intel Rust target for the cross-build
        if: matrix.platform == 'darwin-x64'
        run: rustup target add x86_64-apple-darwin --toolchain 1.96.0

      - name: Install protoc (Linux)
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: startsWith(matrix.platform, 'darwin')
        run: brew install protobuf

      - name: Install pinned protoc (Windows)
        if: startsWith(matrix.platform, 'win32')
        uses: arduino/setup-protoc@v3
        with:
          version: '36.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify protoc
        run: protoc --version

      - run: npm ci

      - name: native/ is byte-identical to the wallet it was copied from
        run: npm run check:provenance

      - name: The SDK revision the pin names is the one checked out
        shell: bash
        run: |
          set -euo pipefail
          cd sdk-source
          head="$(git rev-parse HEAD)"
          echo "sdk-source HEAD: $head"
          test "$head" = "$SWARM_SDK_REV"
          # The SwarmMainnet profile must exist in the SDK this compiles against,
          # or the chain hint has nothing to build.
          grep -rq 'SwarmMainnet' zingolib/src/config.rs
          grep -rq 'SWARM_MAINNET_NAME' zingolib/src/config.rs
          echo "the pinned SDK carries the SWARM production profile"

      # The chain SWARM Mainnet was restarted from on 2026-10-02. The abandoned
      # genesis (01c34428...afdd, served on :8443 until then) must not be pinned.
      - name: The pin file agrees with the restarted network
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const pin = require("./sdk/swarm-sdk-pin.json");
            const expected = "01b76d8a0f18c502b23ab6605e26296d189aa5770fc4a34155e5c7b250a0eff2";
            const abandoned = "01c34428b9e67cdd8345e0b365aaa37dd8d2d65d3869e0e5d77d567f2c39afdd";
            if (pin.commit !== process.env.SWARM_SDK_REV) throw new Error("pin commit != workflow SWARM_SDK_REV");
            if (pin.mainnet.genesis !== expected) throw new Error("pin mainnet genesis is not the restarted genesis");
            if (pin.mainnet.chainHint !== "swarm-mainnet:" + expected) throw new Error("pin chain hint is wrong");
            if (pin.mainnet.server !== "lwd-main.swarm.green:443") throw new Error("pin server is not :443");
            if (pin.mainnet.abandonedGenesis !== abandoned) throw new Error("pin does not name the abandoned genesis");
            console.log("pin agrees: " + pin.mainnet.chainHint);
          '

      - name: The lockfile resolves without changes
        run: cargo fetch --locked --manifest-path native/Cargo.toml

      - name: Build the addon
        run: npm run ${{ matrix.script }}

      # The desktop wallet's own native tests for the restart move (copied with
      # chain_restart.rs from privacy-wallet 8b73dbc3) and the chain hints, on
      # the one platform here that builds for its own host with no --target, so
      # the addon build's dependencies are reused. They use the published
      # all-zero BIP-39 test vector inside the Rust source; nothing is printed.
      - name: Native tests (chain restart move, chain hints)
        if: matrix.platform == 'linux-x64'
        run: cargo test --release --locked --manifest-path native/Cargo.toml --lib -- chain_restart_tests chain_hint_tests

      - name: The addon is built for this platform's architecture (macOS)
        if: startsWith(matrix.platform, 'darwin')
        shell: bash
        run: |
          set -euo pipefail
          archs="$(lipo -archs native.node)"
          echo "native.node architectures: $archs"
          case "${{ matrix.platform }}" in
            darwin-arm64) test "$archs" = "arm64" ;;
            darwin-x64) test "$archs" = "x86_64" ;;
          esac

      # A build that rewrites the lock has changed what it resolved, and a CI run
      # that only says "exit 1" costs another hour to find out what. The diff is
      # printed here so the next failure costs one look.
      - name: The lockfile is still clean
        shell: bash
        run: |
          if ! git diff --quiet -- native/Cargo.lock; then
            echo "cargo rewrote native/Cargo.lock during the build:"
            git diff -- native/Cargo.lock
            exit 1
          fi
          echo "native/Cargo.lock unchanged by the build"

      - name: Save Rust outputs
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      # The bare label must be refused and the full hint accepted (the bug that
      # cost the owner the first mainnet wallet creation), the genesis is the
      # restarted chain's, and the restart move refuses what it must. No network
      # and NO SEED PHRASE: see scripts/check-addon-contract.cjs.
      - name: The addon loads and holds the chain-hint and restart contract
        if: matrix.platform != 'darwin-x64'
        run: node scripts/check-addon-contract.cjs native.node

      # The Intel binary cannot be loaded by the runner's arm64 Node. Under
      # Rosetta an x64 Node can, so the same check runs there when Rosetta can
      # be had; when it cannot, the run says so loudly instead of passing quietly.
      - name: Enable Rosetta for the Intel addon check
        id: rosetta
        if: matrix.platform == 'darwin-x64'
        continue-on-error: true
        run: softwareupdate --install-rosetta --agree-to-license
      - name: The Intel addon loads under an x64 Node and holds the contract
        if: matrix.platform == 'darwin-x64' && steps.rosetta.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo node-x64.tar.gz https://nodejs.org/dist/v22.12.0/node-v22.12.0-darwin-x64.tar.gz
          mkdir node-x64 && tar -xzf node-x64.tar.gz -C node-x64 --strip-components 1
          file node-x64/bin/node
          arch -x86_64 node-x64/bin/node -p 'process.arch'
          arch -x86_64 node-x64/bin/node scripts/check-addon-contract.cjs native.node
      - name: Say plainly that the Intel addon was never loaded
        if: matrix.platform == 'darwin-x64' && steps.rosetta.outcome != 'success'
        run: echo "::warning title=Intel addon not loaded::Rosetta 2 could not be installed on this arm64 runner, so the cross-built x86_64 native.node was never loaded. Its architecture is checked by lipo above, but no one has watched it load."

      - name: Record the hash of what was built
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp native.node "artifact/native-${{ matrix.platform }}.node"
          git rev-parse HEAD > artifact/source-commit.txt
          echo "${{ matrix.platform }}" > artifact/platform.txt
          rustc --version > artifact/rustc.txt
          # Per platform, not one SHA256SUMS.txt: three jobs run in parallel and
          # would each claim the same release asset name.
          sums="artifact/native-${{ matrix.platform }}.node.sha256"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd artifact && sha256sum "native-${{ matrix.platform }}.node" ) | tee "$sums"
          else
            ( cd artifact && shasum -a 256 "native-${{ matrix.platform }}.node" ) | tee "$sums"
          fi

      # The addon binaries go to a GitHub Release, which is the only place in this
      # organisation that can still hold them: the artifact store is over quota. The
      # release is in a private repository, so it is no more public than the
      # artifacts were, and `gh release upload --clobber` makes a re-run idempotent.
      #
      # `create ... || true` because three matrix jobs race here and exactly one of
      # them wins; the losers find the release already there and upload into it.
      - name: Publish the addon to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            notes="The SWARM wallet addon, built from native/ (privacy-wallet a963fd8c plus the"
            notes="$notes chain-restart move of privacy-wallet 8b73dbc3, see native/PROVENANCE.md)"
            notes="$notes against SDK $SWARM_SDK_REV with Rust 1.96.0 and RUSTFLAGS"
            notes="$notes --cfg zcash_unstable=\"nu6.3\". A per-platform SHA-256 file sits beside"
            notes="$notes each binary, and SHA256SUMS.txt is added once all four are up."
            notes="$notes Unsigned, a PRE-release, and not a wallet release."
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "swarm-wallet-core addon - $TAG" \
              --prerelease \
              --notes "$notes" || true
          fi
          gh release upload "$TAG" \
            "artifact/native-${{ matrix.platform }}.node" \
            "artifact/native-${{ matrix.platform }}.node.sha256" \
            --clobber
          echo "published native-${{ matrix.platform }}.node to release $TAG"

      # Creates a wallet nobody funds, syncs it against lwd-main.swarm.green:443,
      # asserts a swm1 address, a birthday at the tip less 100 and a zero balance,
      # and never prints the seed. Then makes a wallet the way 0.2.0 made it on the
      # abandoned chain (with the published 0.2.0 Linux addon, in its own process,
      # from a fresh random seed nobody sees) and proves the 0.3.0 move: backup
      # byte-identical, same addresses, birthday 1, a sync from block 1, zero
      # balance. No funds move: nothing here calls send.
      #
      # In THIS job, not a job of its own, because a separate job would have to
      # receive native.node as an artifact — and on 2026-09-26 the organisation's
      # artifact storage quota was exhausted, so no artifact could be uploaded at
      # all. The binary is already here; carrying it across a job boundary was
      # never load-bearing.
      - name: Make an old-chain wallet with the 0.2.0 addon
        if: ${{ matrix.platform == 'linux-x64' && (inputs.run_live_test == null || inputs.run_live_test) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/addon-020"
          gh release download swarm-wallet-core-0.2.0 --pattern native-linux-x64.node --dir "$RUNNER_TEMP/addon-020"
          echo "a8df9375fd7fc9363a1bac43e6010812b15c516d560d384d0a5e282bdf1904a1  $RUNNER_TEMP/addon-020/native-linux-x64.node" | sha256sum -c -
          node scripts/make-old-chain-fixture.mjs "$RUNNER_TEMP/addon-020/native-linux-x64.node" "$RUNNER_TEMP/old-chain-fixture"
          echo "SWARM_WALLET_CORE_OLD_FIXTURE=$RUNNER_TEMP/old-chain-fixture" >> "$GITHUB_ENV"

      - name: Create a throwaway mainnet wallet and sync it; move the old-chain wallet
        if: ${{ matrix.platform == 'linux-x64' && (inputs.run_live_test == null || inputs.run_live_test) }}
        env:
          SWARM_WALLET_CORE_LIVE: "1"
        run: npx vitest run test/live.test.ts

      # Non-fatal on purpose. The upload is a convenience — the SHA-256 and the
      # provenance are in the step above and in the job log, which is what a
      # release actually cites. On 2026-09-26 this step alone turned three green
      # addon builds red with "Failed to CreateArtifact: Artifact storage quota has
      # been hit", and a quota problem in the organisation's billing must not be
      # reported as a wallet that does not compile. When the quota is free again
      # the artifacts appear and nothing else changes.
      - name: Keep the built addon, if there is room for it
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: swarm-wallet-core-addon-${{ matrix.platform }}
          path: |
            artifact/
            native/Cargo.lock
            sdk/swarm-sdk-pin.json
          retention-days: 30

  # Reads the four binaries back OUT of the release and hashes them there. That
  # makes the sums a check of what was actually published, not a copy of what each
  # runner said it had, and it is the one place all three platforms meet now that
  # the artifact store cannot be used.
  sums:
    name: SHA256SUMS on the release
    needs: addon
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # The package itself, packed from the same commit, so the messenger can
      # vendor the tgz from the release rather than from someone's workstation.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Pack the package
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm pack
          ls -l swarm-wallet-core-*.tgz

      - name: Resolve the release tag
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="swarm-wallet-core-${GITHUB_REF_NAME#build-}"
          fi
          : "${tag:=swarm-wallet-core-0.1.0-m1}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Hash what the release actually holds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tgz="$(ls swarm-wallet-core-*.tgz)"
          gh release upload "$TAG" "$tgz" --clobber
          mkdir -p dl && cd dl
          gh release download "$TAG" --pattern 'native-*.node' --clobber
          gh release download "$TAG" --pattern 'swarm-wallet-core-*.tgz' --clobber
          ls -l
          sha256sum native-*.node swarm-wallet-core-*.tgz | tee SHA256SUMS.txt
          count="$(ls native-*.node | wc -l)"
          # Said out loud rather than inferred from a missing line: a release with
          # three binaries in it is not the release the messenger should build
          # against, and the notes are where anyone looks first.
          if [ "$count" -lt 4 ]; then
            warning="**Incomplete: $count of 4 platforms published.** A platform build failed; see the run."
          else
            warning="All four platforms published (Windows x64, Linux x64, macOS arm64, macOS x64)."
          fi
          {
            echo "### native.node, as published"
            echo
            echo "$warning"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Source commit \`$GITHUB_SHA\`. Rust 1.96.0, RUSTFLAGS \`--cfg zcash_unstable=\"nu6.3\"\`,"
            echo "SDK \`$SWARM_SDK_REV\`, addon source privacy-wallet \`a963fd8c\` plus the chain-restart move of \`8b73dbc3\` (native/PROVENANCE.md)."
            echo "SWARM Mainnet genesis \`01b76d8a0f18c502b23ab6605e26296d189aa5770fc4a34155e5c7b250a0eff2\` (restarted 2026-10-02), server lwd-main.swarm.green:443."
            echo "Unsigned PRE-release. Verify with \`sha256sum -c SHA256SUMS.txt\`."
          } > notes.md
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
